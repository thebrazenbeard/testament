        normalized_surviving_clause: "kai tote diablepseis ekbalein to karphos to en to ophthalmō tou adelphou sou"
        overlap_note: "The direct Greek conclusion supports the thirteen-word Luke 6:42 comparison used in the dependence control; opening/middle material remains Coptic-only."
        guard: "The fragment's line-level coverage does not support reconstruction of the complete Greek saying or a secure whole-logion Greek/Coptic variant map."
