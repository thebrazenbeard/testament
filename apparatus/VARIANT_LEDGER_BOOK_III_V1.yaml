        manuscript_lines: "P.Oxy. 654.9-21"
        direct_line_control:
          line_15: "...KAI H BAS["
          line_16: "ENTOS YMWN [.]STI ["
          consequence: "A kingdom-expression immediately precedes entos hymon, but the complete divine-title phrase is not continuously extant."
        secure_difference:
          greek_form: "The second false location is represented as under the earth in the published Greek form."
          coptic_form: "The corresponding Coptic form says the kingdom is in the sea."
          consequence: "The location pair changed in transmission; the Coptic is not a word-for-word witness to the Greek fragment."
        reconstruction_guard:
          greek_divine_title: "Completion of BAS[ to basileia and restoration of theou in the lacuna before entos hymon remain editorial reconstruction."
          missing_text: "Any Coptic completion of Greek lacunae remains reconstruction."
          quotation_rule: "Do not quote the full normalized 'kingdom of God is within you' phrase as continuously extant papyrus ink."
      guard: "P.Oxy. 654 is lacunose in parts of logion 3; Coptic completion is not direct Greek readback."

    thomas_113:
      coptic_witness: WIT-NHC-II-GOSPEL-THOMAS
      greek_witness: NONE_SURVIVING_CURRENTLY_BOUND
      form_note: "Thomas 113 describes the kingdom as spread upon the earth while people fail to see it."
      guard: "Do not infer extant Greek Thomas 113 or use Thomas 113 to settle Luke's Greek semantics."

    dependence_control:
      bibliography: research/bibliography/THOMAS_SYNOPTIC_DEPENDENCE_V1.md
      cluster_state:
        state: RELATION_DISPUTED
        evidence_balance: RELATED_KINGDOM_TRADITIONS_WITH_NONIDENTICAL_LOCAL_HISTORIES
        guard: "Thomas 3 and 113 are related within Thomas but must not share one undifferentiated Luke-dependence judgment."
      Thomas_3_vs_Luke_17_21:
        state: RELATION_DISPUTED
        evidence_balance: DIRECT_GREEK_ENTOS_OVERLAP_STRONG_CONTACT_ARGUMENT_WITH_LACUNA_AND_THOMASINE_EXPANSION
        direct_greek_evidence:
          witness: WIT-POXY-654-GOSPEL-THOMAS
          line_collation: research/collations/THOMAS_3_26_GREEK_LINE_COLLATION_V1.md
          manuscript_lines: "P.Oxy. 654.9-21"
          report: "The editio-princeps line sequence preserves the kingdom stem at line 15 and entos hymon at line 16; the intervening divine-title completion is editorial restoration."
          restoration_guard: "The Greek divine title 'kingdom of God' is partly reconstructed; do not call the entire Luke-like phrase continuously extant papyrus ink."
        contact_argument:
          scholars:
            - Mark_Goodacre
            - M_David_Litwa_summary_of_Goodacre
          report: "Goodacre's dependence case treats the Greek Thomas 3 / Luke 17:21 entos-hymon overlap as a striking and unusual direct Greek contact datum."
        counterarguments:
          - kind: THOMASINE_EXPANSION
            report: "Thomas 3 adds outside-you language, false-location contrasts and self-knowledge/children-of-the-Father material not present in Luke 17:21."
          - kind: INTRA_THOMAS_TRANSMISSION
            report: "Greek and Coptic Thomas 3 differ in the second false location (under the earth versus in the sea), so the saying itself was not textually flat."
          - kind: COMMON_TRADITION_MODEL
            scholar: Stephen_J_Patterson
            report: "Patterson treats Thomas 3 as a philosophically/theologically recast form related to a common reign-of-God tradition also reflected in Thomas 113 and Luke 17:20-21."
          - kind: COMPARATIVE_METHOD
            scholar: Melissa_Harl_Sellew
            doi: "10.1093/oxfordhb/9780190887452.013.27"
        adjudication: "The direct Greek entos-hymon overlap gives Synoptic/Lukan contact arguments meaningful local weight, but restoration boundaries and substantial Thomasine development prevent direct dependence from being established."
      Thomas_113_vs_Luke_17_20_21:
        state: RELATION_DISPUTED
        evidence_balance: COMMON_TRADITION_ARGUMENT_SUBSTANTIAL_NO_GREEK_THOMAS_WITNESS
        witness_limit:
          witness: WIT-NHC-II-GOSPEL-THOMAS
          greek_witness: NONE_SURVIVING_CURRENTLY_BOUND
          guard: "Literary-direction claims cannot rely on direct Greek Thomas 113 evidence because none survives."
        common_tradition_positions:
          - scholar: Stephen_J_Patterson
            report: "Patterson treats Thomas 113 and Luke 17:20-21 as witnesses to a common present-reign tradition, with Thomas 3 as a later Thomasine theological recasting."
          - source: Older_Thomas_source_criticism
            report: "Older scholarship has argued that Thomas 113 reflects a pre-Lukan/shared tradition rather than direct dependence on Luke."
        dependence_countermodel:
          state: LUKE_OR_SYNOPTIC_INFLUENCE_REMAINS_POSSIBLE
          guard: "Conceptual and verbal proximity to Luke remains relevant, but no direct Greek Thomas 113 witness exists to support a diagnostic wording argument."
        adjudication: "Common-tradition models have substantial local support, but direct literary direction remains unresolved."
      guard: "Neither Thomas 3 nor Thomas 113 may be used to adjudicate Luke's lexical force or Testament's authored kingdom-within thesis."

    project_bias_guard:
      risk: HIGH
      reason: "The Testament's agency thesis has strong literary interest in 'the kingdom within.'"
      rule: "Book III must preserve the Luke translation dispute and explicitly separate it from later authored use of 'kingdom within' language."

    historical_ceiling:
      strong:
        - "Luke preserves a kingdom saying that resists simple observable localization."
        - "Thomas 3 is directly witnessed in fragmentary Greek P.Oxy. 654 and complete Coptic NHC II."
        - "Thomas 113 is directly extant in Coptic NHC II and has no currently bound Greek witness."
      not_secure:
