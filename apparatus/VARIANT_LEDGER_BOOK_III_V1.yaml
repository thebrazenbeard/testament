schema_version: testament.variant_ledger.book_iii.v1
status: ACTIVE_PARTIAL
scope: BOOK_III_SAYINGS
creation_parent: 09fcc02c0e4493c2e41195453f844b9d9f2d14b9

rules:
  - "Book III wording-sensitive sayings must bind a declared working text before prose promotion."
  - "A critical-edition reading is not automatically the historical wording."
  - "Reported manuscript support is labeled as scholarly/apparatus evidence unless Testament has performed autoptic collation."
  - "Synoptic harmonization is a transmission hypothesis to test, not a license to reconstruct an original prayer."
  - "Didache parallels remain reception/transmission evidence unless literary independence is separately established."

variants:
  - id: VAR-LUKE-11-2-4-LORDS-PRAYER
    saying: SAY-LORDS-PRAYER
    passage: Luke_11_2_4
    consequence: PRAYER_WORDING_SOURCE_RELATION_AND_LITURGICAL_HARMONIZATION
    working_text:
      edition: ED-SBLGNT
      state: SHORTER_CRITICAL_FORM
      guard: "SBLGNT is the reproducible working comparison text, not a claim to the exact historical prayer."

    variant_units:
      - id: LUKE11-2-OPENING-ADDRESS
        shorter_form: "Father"
        expansion_family: "Adds Matthean-style 'our' / heavenly-address wording."
        evidence:
          - kind: CRITICAL_EDITION_APPARATUS
            source: SBLGNT
            report: "SBLGNT flags the expansion after the opening address."
        witness_binding: EDITION_SIGNAL_ONLY
        state: SIGNIFICANT_VARIANT_REQUIRES_DEEPER_WITNESS_BINDING

      - id: LUKE11-2-WILL-PETITION
        shorter_form: "No Matthean 'your will be done ... on earth' petition."
        expansion_family: "Adds the Matthean-style will petition."
        evidence:
          - kind: CRITICAL_EDITION_APPARATUS
            source: SBLGNT
            report: "SBLGNT flags the additional will petition in the alternative tradition."
          - kind: PUBLISHED_TEXTUAL_NOTE
            source: NET_Bible_Luke_11_2
            report: "The shorter reading is reported for P75, Vaticanus and L among other witnesses; the longer expansion is reported in a broad later/alternative stream including Bezae."
        witness_support:
          shorter:
            - WIT-P75-HANNA-1
            - WIT-03-CODEX-VATICANUS
          expansion:
            - WIT-D05-CODEX-BEZAE
        witness_binding: SCHOLARLY_TEXTUAL_NOTE_NOT_AUTOPTIC
        state: HARMONIZATION_TOWARD_MATTHEW_STRONGLY_PLAUSIBLE

      - id: LUKE11-4-DELIVERANCE-PETITION
        shorter_form: "Ends after the testing/temptation petition."
        expansion_family: "Adds the Matthean-style deliverance-from-evil petition."
        evidence:
          - kind: CRITICAL_EDITION_APPARATUS
            source: SBLGNT
            report: "SBLGNT flags the deliverance petition as an addition in the alternative tradition."
          - kind: PUBLISHED_TEXTUAL_NOTE
            source: NET_Bible_Luke_11_4
            report: "The omission is reported for P75 and Vaticanus among other witnesses; the expansion is reported in a broad stream including Bezae. Sinaiticus has hand/corrector complexity and is intentionally not normalized here."
        witness_support:
          shorter:
            - WIT-P75-HANNA-1
            - WIT-03-CODEX-VATICANUS
          expansion:
            - WIT-D05-CODEX-BEZAE
        witness_binding: SCHOLARLY_TEXTUAL_NOTE_NOT_AUTOPTIC
        state: HARMONIZATION_TOWARD_MATTHEW_STRONGLY_PLAUSIBLE

    source_relation:
      Matthew_Luke:
        state: DISPUTED
        guard: "Shared material does not by itself prove Q, direct dependence, or multiple autonomous recensions."
      Didache_8_2:
        state: DISPUTED
        guard: "Didache's close relation to the Matthean form may reflect Matthew, Q-like/shared liturgical tradition, or another transmission route; independence is not presumed."
        scholarship:
          - author: Olegs_Andrejevs
            title: "A Source-critical Analysis of the Lord's Prayer: Multiple Autonomous Recensions or Q?"
            journal: Ephemerides_Theologicae_Lovanienses
            year: 2020
            doi: "10.2143/ETL.96.4.3288794"

    historical_ceiling:
      strong:
        - "Luke's extant manuscript tradition contains pressure toward a more Matthean form in wording-sensitive parts of the prayer."
        - "Matthew, Luke and Didache preserve materially related prayer forms."
      not_secure:
        - "The exact wording spoken by Yeshua."
        - "A single recoverable original recension behind all three forms."
        - "Didache's exact literary dependence on Matthew or an independent Q-like/liturgical source."
        - "A globally earlier prayer merely by selecting the shorter Lucan form."

    manuscript_rule: "Book III must not print a harmonized Lord's Prayer as recovered speech. Any reconstructed core must mark every inferred word and keep Matthew/Luke/Didache transmission hypotheses visible."


  - id: VAR-MATT-5-44-ENEMY-LOVE-HARMONIZATION
    saying: SAY-ENEMY-LOVE
    passage: Matthew_5_44
    parallels:
      - Luke_6_27_28
      - Didache_1_3_4
    consequence: ENEMY_LOVE_WORDING_AND_INTERTEXTUAL_HARMONIZATION
    working_text:
      edition: ED-SBLGNT
      state: SHORTER_MATTHEAN_FORM
      guard: "The critical working form does not by itself establish the wording spoken by Yeshua."

    variant_units:
      - id: MATT5-44-LUKE-LIKE-EXPANSION
        shorter_form: "Love enemies; pray for persecutors."
        expansion_family: "Adds clauses corresponding closely to Luke 6:27-28: blessing those who curse, doing good to those who hate, and prayer for mistreatment/persecution."
        evidence:
          - kind: PUBLISHED_TEXTUAL_NOTE
            source: NET_Bible_Matthew_5_44
            report: "The shorter form is reported in Sinaiticus and Vaticanus among other witnesses; the expanded form is reported in Bezae, Washingtonianus, Koridethi/Theta and a broad later stream."
          - kind: TEXTUAL_CAUSATION_ASSESSMENT
            source: NET_Bible_Matthew_5_44
            report: "The expansion is assessed as motivated assimilation to Luke 6:27-28."
        witness_support:
          shorter:
            - WIT-01-CODEX-SINAITICUS
            - WIT-03-CODEX-VATICANUS
          expansion:
            - WIT-D05-CODEX-BEZAE
            - WIT-032-CODEX-WASHINGTONIANUS
            - WIT-038-CODEX-KORIDETHI
        witness_binding: SCHOLARLY_TEXTUAL_NOTE_NOT_AUTOPTIC
        state: STRONG_HARMONIZATION_CONTROL

    didache_parallel:
      source: SRC-DIDACHE
      passage: Didache_1_3d_4a
      physical_witnesses:
        - WIT-POXY-1782-DIDACHE
        - WIT-DIDACHE-H54-HIEROSOLYMITANUS
      transmission_state: MULTIBRANCH_TEXTUAL_HISTORY
      evidence:
        - kind: SCHOLARLY_WITNESS_REPORT
          source: Bentley_Layton
          doi: "10.1017/S0017816000029242"
          report: "P.Oxy. 1782 directly preserves Didache 1.3d-4a; H preserves the complete section. Layton places the papyrus/Apostolic-Constitutions line in a different transmission branch from H."
      guard: "A physical Didache witness establishes the Didache text's transmission, not independent historical attestation of Yeshua's wording."

    source_relation:
      Matthew_Luke:
        state: DISPUTED
        guard: "The shared enemy-love complex may be explained through Q-like shared tradition or direct literary dependence under competing Synoptic models."
      Didache_Synoptics:
        state: HIGHLY_DISPUTED
        positions:
          - scholar: Bentley_Layton
            position: "Treats the Didache compositor in this section as using Matthean material, including Matthew 5:39-42 and 5:43-48."
            doi: "10.1017/S0017816000029242"
          - scholar: Alan_Garrow
            position: "Under the Matthew Conflator hypothesis, proposes Didache 1.2-5a as an extant source-like instance feeding Luke and ultimately Matthew."
            doi: "10.1017/S0028688516000072"
        guard: "Neither direction of dependence is promoted to project fact; oral/shared sayings and other compositional models remain live."

    historical_ceiling:
      strong:
        - "Matthew 5:44 underwent textual harmonization toward the fuller Lukan wording in a substantial manuscript stream."
        - "Didache 1.3d-4a is physically attested by P.Oxy. 1782 by the late fourth century and by the complete H manuscript in 1056."
        - "The enemy-love/non-retaliation complex circulated in multiple early Christian textual settings."
      not_secure:
        - "That Matthew's shorter critical form is the exact historical wording."
        - "That Luke preserves a verbatim fuller original."
        - "That Didache is independent of Matthew and Luke."
        - "That Didache is a source for Luke or Matthew."
        - "That three extant literary forms equal three independent historical witnesses."

    manuscript_rule: "Book III comparison must use the shorter critical Matthew 5:44 as the working Matthean form while exposing the Luke-like expansion. Didache may be shown as a distinct transmitted form, but its independence must remain unresolved."



  - id: VAR-BEATITUDES-POOR-MATT-LUKE-THOMAS
    saying: SAY-BEATITUDES
    control_kind: CROSS_SOURCE_SAYING_FORM_NOT_SAME_WORK_MANUSCRIPT_VARIANT
    passages:
      - Matthew_5_3
      - Luke_6_20
      - Thomas_54
      - Thomas_68
      - Thomas_69
    consequence: POVERTY_REVERSAL_WORDING_AND_THOMAS_DEPENDENCE

    extant_forms:
      Matthew_5_3:
        working_text: ED-SBLGNT
        form_note: "Blessing qualifies the poor with 'in spirit' and promises the kingdom of the heavens."
        guard: "Matthean wording is not silently substituted into Luke or Thomas."
      Luke_6_20:
        working_text: ED-SBLGNT
        form_note: "Direct address blesses the poor without Matthew's 'in spirit' qualifier and promises the kingdom of God."
        guard: "Shorter/unqualified wording does not automatically equal earlier wording."
      Thomas_54:
        witness: WIT-NHC-II-GOSPEL-THOMAS
        form_note: "The extant Coptic Thomas form blesses the poor and links them with the kingdom of heaven."
        witness_binding: DIRECT_EXTANT_COPTIC_DIGITAL_TEXT
        guard: "No surviving Greek Thomas manuscript preserves logion 54; exact Greek wording is unavailable."
      Thomas_68_69:
        witness: WIT-NHC-II-GOSPEL-THOMAS
        form_note: "The same Coptic witness preserves related persecution and hunger beatitudes."
        witness_binding: DIRECT_EXTANT_COPTIC_DIGITAL_TEXT
        guard: "These related sayings may illuminate Thomasine clustering but do not prove a single original Synoptic beatitude set."

    greek_fragment_control:
      witnesses_described_for_SRC_GOSPEL_THOMAS:
        - P.Oxy._1
        - P.Oxy._654
        - P.Oxy._655
      preserved_ranges:
        P.Oxy._654: "Prologue and sayings 1-7"
        P.Oxy._1: "Sayings 26-33 with the known 77b placement"
        P.Oxy._655: "Sayings 24 and 36-39"
      conclusion: "None directly witnesses Thomas 54, 68 or 69."
      manuscript_rule: "Do not cite the Oxyrhynchus Thomas fragments as Greek witnesses for this beatitude cluster."

    source_relation:
      state: DISPUTED_INTERTEXTUAL_RELATION
      scholarship:
        - author: Melissa_Harl_Sellew
          title: "The Gospel of Thomas and the Synoptics"
          year: 2023
          doi: "10.1093/oxfordhb/9780190887452.013.27"
          position: "Moves comparison beyond a simple dependence-versus-autonomy binary and treats style/content comparison as useful even where global dependence is unresolved."
      guard: "Similarity between Thomas 54 and Luke 6:20 on unqualified poverty does not establish Thomasine independence, priority, or direct copying in either direction."

    witness_date_control:
      physical_witness: WIT-NHC-II-GOSPEL-THOMAS
      date: "fourth century CE"
      rule: "The date of NHC II is a terminus for this surviving copy, not a date for composition of Gospel of Thomas or logion 54."

    historical_ceiling:
      strong:
        - "Matthew, Luke and the extant Coptic Thomas preserve materially comparable poverty/kingdom beatitude forms."
        - "Thomas 54, 68 and 69 are directly extant in Nag Hammadi Codex II."
        - "No surviving Greek Thomas fragment currently bound by Testament preserves these logia."
      not_secure:
        - "That Thomas 54 preserves an independent pre-Synoptic form."
        - "That Luke's unqualified poor is earlier than Matthew's qualified form."
        - "That Matthew's 'poor in spirit' is a secondary spiritualization of one recoverable original."
        - "The exact Greek exemplar underlying the Coptic wording of Thomas 54, 68 or 69."
        - "A single original number/order of beatitudes behind Matthew, Luke and Thomas."

    manuscript_rule: "Book III must display Matthew, Luke and Thomas as distinct extant forms. Any Greek back-translation of Thomas 54/68/69 is reconstruction and must be marked as such."



  - id: VAR-ASK-SEEK-KNOCK-THOMAS-2-92
    saying: SAY-ASK-SEEK-KNOCK
    control_kind: CROSS_SOURCE_RELATED_SEEKING_TRADITIONS_PLUS_INTRA_THOMAS_TRANSMISSION
    passages:
      - Matthew_7_7_11
      - Luke_11_9_13
      - Thomas_2
      - Thomas_92
    consequence: SEEKING_PRAYER_WORDING_THOMAS_TRANSMISSION_AND_DEPENDENCE

    synoptic_forms:
      Matthew_7_7_11:
        working_text: ED-SBLGNT
        form_note: "Ask/receive, seek/find, knock/opened, followed by parent-child gift analogy and 'good things' climax."
        guard: "Matthew's climax is not harmonized with Luke's."
      Luke_11_9_13:
        working_text: ED-SBLGNT
        form_note: "Ask/receive, seek/find, knock/opened, followed by parent-child gift analogy and Holy Spirit climax."
        guard: "Luke's Holy Spirit climax remains a distinct extant form rather than being normalized to Matthew."

    thomas_forms:
      Thomas_2:
        greek_witness: WIT-POXY-654-GOSPEL-THOMAS
        coptic_witness: WIT-NHC-II-GOSPEL-THOMAS
        relation_to_synoptics: RELATED_SEEK_FIND_TRADITION_NOT_EXACT_ASK_SEEK_KNOCK_PARALLEL
        transmission_state: GREEK_AND_COPTIC_FORMS_NOT_IDENTICAL
        published_comparison:
          greek_fragment: "Published reconstructions of fragmentary P.Oxy. 654 preserve seek/find and a progression through astonishment/reigning/rest."
          coptic_form: "The Coptic NHC II form preserves seek/find followed by disturbance/astonishment and reigning, without the same final rest clause."
        guard: "The Greek papyrus is fragmentary; restored lacunae remain scholarly reconstruction. Neither form is promoted to the exact historical wording."
      Thomas_92:
        coptic_witness: WIT-NHC-II-GOSPEL-THOMAS
        greek_witness: NONE_SURVIVING_CURRENTLY_BOUND
        relation_to_synoptics: RELATED_SEEK_FIND_TRADITION
        form_note: "The extant Coptic saying begins with seek/find language but develops into a saying about questions formerly asked and no longer being sought."
        guard: "Thomas 92 must not be treated as if P.Oxy. 654 or another Greek fragment directly witnesses it."

    greek_fragment_control:
      P_Oxy_654:
        witness: WIT-POXY-654-GOSPEL-THOMAS
        date: "ca. 200-250 CE"
        scope: "opening lines through logion 7"
        directly_relevant_to_cluster:
          - Thomas_2
        not_witnessed:
          - Thomas_92
      conclusion: "This cluster contains one Thomas saying with Greek+Coptic evidence and another with currently bound Coptic-only evidence."

    dependence_control:
      Matthew_Luke:
        state: DISPUTED
        guard: "Double-tradition similarity is compatible with Q-like shared tradition or direct literary dependence under competing Synoptic models."
      Thomas_2_92_vs_Synoptics:
        state: RELATED_TRADITION_DIRECTION_UNRESOLVED
        guard: "Shared seek/find language does not establish direct copying, independence, priority, or one recoverable original."
      Thomas_internal:
        state: TRANSMISSION_VARIATION_ESTABLISHED_FOR_LOGION_2
        guard: "Greek/Coptic divergence in Thomas 2 is evidence of textual transmission, not permission to select whichever form better fits a reconstruction."

    historical_ceiling:
      strong:
        - "Matthew and Luke preserve closely related ask/seek/knock complexes with distinct climactic wording."
        - "Thomas 2 is directly witnessed in both fragmentary Greek P.Oxy. 654 and Coptic NHC II."
        - "Thomas 92 is directly witnessed in NHC II but has no surviving Greek witness currently bound by Testament."
        - "The Greek and Coptic forms of Thomas 2 are not textually identical."
      not_secure:
        - "That Thomas 2 or 92 derives directly from Matthew or Luke."
        - "That Matthew or Luke derives directly from Thomas."
        - "That Q uniquely explains the Matthew/Luke relation."
        - "That P.Oxy. 654 supplies a complete, unrestored Greek text of Thomas 2."
        - "That the Greek Thomas 2 form is automatically earlier in composition because its surviving witness is earlier."
        - "A single original saying combining all Synoptic and Thomas elements."

    manuscript_rule: "Book III must present Matthew, Luke, Thomas 2 Greek/Coptic, and Thomas 92 as distinct extant/transmitted forms. Do not reconstruct one mega-saying or cite a Greek Thomas 92 that does not survive."


