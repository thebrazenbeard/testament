          source: Mark_Goodacre
          report: "The complete Coptic Thomas form preserves the opening and conclusion but omits the intervening hypothetical dialogue/hypocrite material found in Matthew/Luke; Goodacre treats this as a recurring Thomasine 'missing middle' phenomenon compatible with abbreviation from Synoptic forms."
          manuscript_guard: "P.Oxy. 1 itself does not preserve the opening/middle of logion 26, so the missing-middle pattern is established from Coptic Thomas plus Synoptic comparison, not from a complete Greek Thomas witness."
        counterarguments:
