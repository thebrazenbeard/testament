      reception_controls:
        versional:
          ledger_record: VP-LUKE17-21-LATIN-SYRIAC-RECEPTION
          collation_control: research/collations/LUKE17_21_VERSIONAL_TEXT_COLLATION_V1.md
          latin_state: DIRECT_VULGATE_INTRA_VOS_PLUS_OLD_LATIN_REPORTED
          peshitta_state:
            state: DIRECT_TEXT_COLLATION_BOUND
