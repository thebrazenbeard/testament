    dependence_control:
      bibliography: research/bibliography/THOMAS_SYNOPTIC_DEPENDENCE_V1.md
      Synoptics:
        state: COMPOSITE_WITH_MARKAN_RELATED_MATERIAL
        guard: "Matthew/Luke overlap is not automatically independent attestation; Mark's separate measure placement complicates reconstruction."
      Thomas_26_vs_Synoptics:
        state: RELATION_DISPUTED
        evidence_balance: DIRECT_GREEK_VERBATIM_AGREEMENT_STRONG_CONTACT_ARGUMENT_WITH_ORAL_COUNTERMODEL
        direct_greek_evidence:
          witness: WIT-POXY-1-GOSPEL-THOMAS
          line_collation: research/collations/THOMAS_3_26_GREEK_LINE_COLLATION_V1.md
          manuscript_lines: "P.Oxy. 1.1-4"
          preserved_scope: "Only the concluding portion of Thomas 26 is extant in P.Oxy. 1."
          report: "Goodacre identifies a thirteen-word verbatim agreement in the surviving Greek ending with Luke 6:42; the position of ekbalein also aligns with Matthew 7:5."
          significance: "This is materially stronger dependence evidence than a Coptic-only thematic parallel because the comparison is Greek-to-Greek."
