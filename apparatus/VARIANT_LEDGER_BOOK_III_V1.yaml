        patristic:
          ledger_record: PAT-TERTULLIAN-LUKE17-21-POWER
          state: ANCIENT_WITHIN_REACH_OR_POWER_EXEGESIS
        adjudication: "RECEPTION_HISTORY_CONSTRAINS_POSSIBILITIES_BUT_DOES_NOT_DECIDE_GREEK_SOURCE_SENSE"
      lexical_evidence:
        - "The other New Testament use of entos is Matthew 23:26, where it denotes the inside/interior of a cup."
        - "LSJ centers entos on within/inside/within-bounds usage and records extensions involving range, group bounds, self-control and being within one's power."
        - "Roberts notes that Luke uses en tō mesō repeatedly for among/in-the-midst language and argues for a within-your-power sense."
        - "Ramelli's broad Greek and Syriac study argues for inside/within and treats en mesō as Luke's ordinary among/in-the-midst expression."
        - "A substantial modern commentary stream nevertheless prefers among/in-your-midst on contextual and Lukan-theological grounds."
      guard: "Do not misstate an exegetical/contextual preference for 'among' as a simple dictionary result, and do not let the lexical center of 'within' carry Book VIII's agency thesis by itself."

    thomas_3:
      greek_witness: WIT-POXY-654-GOSPEL-THOMAS
      coptic_witness: WIT-NHC-II-GOSPEL-THOMAS
