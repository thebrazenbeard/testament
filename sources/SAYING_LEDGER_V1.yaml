schema_version: testament.saying_ledger.v1
status: RESEARCH_ACTIVE

invariants:
  - "A saying version is an extant textual form, not automatically the historical wording."
  - "Three Synoptic occurrences are not three independent witnesses when literary dependence is probable."
  - "Q is a reconstruction under one family of Synoptic hypotheses, not an extant manuscript."
  - "Thomas parallels are evaluated per saying; neither blanket independence nor blanket dependence is assumed."
  - "Didache parallels are reception/transmission evidence unless independence is separately established."
  - "Authored synthesis in Book III never becomes a reconstructed quotation."

