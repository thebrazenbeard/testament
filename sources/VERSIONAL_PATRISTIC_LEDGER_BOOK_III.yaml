    syriac:
      Old_Syriac_Sinaitic_and_Curetonian:
        state: LEXEME_SEMANTICALLY_AMBIGUOUS_DIRECT_CAL_BOUND
        text_state: DIRECT_CAL_ROMANIZATION_BOUND_TARGET_UNICODE_DERIVED_SOURCE_UNICODE_REJECTED
        edition_anchor: "Kiraz, Comparative Edition of the Syriac Gospels, vol. 3, p. 352"
        computational_source:
          repository: chenzhan4321/diatessaron-synopsis
          commit: 6b165111c292aaa128272ff0d2daeb866986c0d7
          Curetonian_blob: 768adf5651583b842cf4192367527a77687be696
          Sinaiticus_blob: 7facf587c87237320defef3980872bc3b2749a32
          converter_blob: 49099dc8dae6ba6c7bf2d965fb3d0dfbb69edf39
        direct_CAL:
          Curetonian: "wl) n)mrwn h) hrk) hy )w h) hrtmn hy, h) gyr mlkwth d)lh) byntkwn%"
          Sinaiticus: "wl) )mryn hrk) hy )w hrtmn hy h) gyr mlkwth d)lh) byntkwn,"
          shared_target: byntkwn
        derived_unicode_target: "ܒܝܢܬܟܘܢ"
        source_unicode_state: REJECTED_AT_THIS_LOCUS_VERSE_MISALIGNMENT
