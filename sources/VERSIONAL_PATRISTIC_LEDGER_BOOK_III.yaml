  - id: PAT-TERTULLIAN-LUKE17-21-POWER
    passage: Luke_17_21
    kind: PATRISTIC_EXEGESIS
    author: Tertullian
    work: Against_Marcion
    locator: "Book IV, chapter 35"
    interpretation: WITHIN_YOUR_HAND_OR_POWER
    report: "Tertullian explicitly interprets 'within you' as 'in your hand, within your power' if one hears and does God's commandment."
    evidence:
      - url: "https://www.newadvent.org/fathers/03124.htm"
    significance:
      - "Confirms an ancient reception corresponding closely to the modern 'within your reach/power' interpretive family."
      - "Shows that interior wording did not require a purely psychological 'inside the soul' interpretation."
    guard:
      - "Patristic exegesis is reception evidence, not a lexical override of Luke's Greek."
      - "Tertullian's theological linkage to Deuteronomy 30 is interpretation, not proof of Luke's intended source."



  - id: ECR-DIDACHE-1-2-3-DOUBLE-ENEMY-LOVE
    passages:
      - Didache_1_2
      - Didache_1_3
    kind: EARLY_CHRISTIAN_RECEPTION_AND_NONCANONICAL_PARALLEL
    work: Didache
    physical_witness: WIT-DIDACHE-H54-HIEROSOLYMITANUS
    related_variants:
      - VAR-DOUBLE-LOVE-TORAH-SUMMARY
      - VAR-MATT-5-44-ENEMY-LOVE-HARMONIZATION
    text_state: DIRECT_PUBLISHED_GREEK_EDITION_PLUS_BOUND_PHYSICAL_WITNESS
    reception:
      Didache_1_2: "Places love of God and love of neighbor together at the head of the Way of Life and follows them with a negative-form reciprocal maxim."
      Didache_1_3: "Immediately develops blessing persecutors/enemies and loving those who hate, alongside nonretaliation material."
    significance:
      - "Provides early Christian evidence for a combined love-command + enemy-love ethical complex outside the canonical narrative settings."
      - "Shows reception/recombination of Torah-summary and Jesus-tradition material without making literary direction self-evident."
    evidence:
      - source: Lightfoot_Apostolic_Fathers_Didache_1
        url: "https://www.ccel.org/ccel/lightfoot/fathers.ii.xii.html"
      - source: Lake_Greek_Didache
        url: "https://www.ccel.org/ccel/lake/fathers2.v.html"
    guard:
      - "Didache is an early Christian work, not a Gospel manuscript."
      - "Its combination of material does not prove dependence on Matthew, Luke, or Mark rather than shared/other tradition."
      - "One Didache work is not multiplied into separate independent historical attestations for each maxim."

