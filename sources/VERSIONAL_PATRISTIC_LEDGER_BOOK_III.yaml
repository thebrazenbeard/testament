        text_state: COMPARATIVE_EDITION_REPORTED_DIRECT_STABLE_UNICODE_PENDING
        edition_anchor: "Kiraz, Comparative Edition of the Syriac Gospels, vol. 3, p. 352"
        report: "Ramelli argues the hyper-literal Harklean likewise uses an inside/interior expression."
