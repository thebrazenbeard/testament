records:
  - id: VP-LUKE11-4-LONGER-VERSIONAL-STREAMS
    passage: Luke_11_4_deliverance_petition
    kind: VERSIONAL_APPARATUS_STREAM
    reading: EXPANDED_DELIVERANCE_FORM
    reported_support:
      - siglum: it
        label: Old_Latin_collective
        type: VERSIONAL_STREAM_NOT_SINGLE_MANUSCRIPT
      - siglum: sy_c
        label: Curetonian_Syriac
        type: VERSIONAL_WITNESS_WITH_PHYSICAL_NODE
        physical_witness: WIT-CURETONIAN-SYRIAC
      - siglum: sy_p
        label: Peshitta_Syriac
        type: VERSIONAL_STREAM_NOT_PHYSICALLY_BOUND_HERE
      - siglum: sy_h
        label: Harklean_Syriac
        type: VERSIONAL_STREAM_NOT_PHYSICALLY_BOUND_HERE
    evidence:
      - source: NET_Bible_Luke_11_4_textual_note
        report: "Published apparatus summary lists it and sy(c,p,h) among witnesses adding the Matthean-style deliverance petition."
        url: "https://classic.net.bible.org/passage.php?passage=Luk+11%3A4"
    guard:
      - "Collective version sigla are not physical manuscript identities."
      - "Versional support may reflect translation history and cross-contamination; it does not automatically establish the Greek archetype."
      - "The Curetonian physical node is separately bound; Peshitta and Harklean remain stream-level evidence in this ledger."

  - id: VP-LUKE11-4-SHORTER-VERSIONAL-STREAMS
    passage: Luke_11_4_deliverance_petition
    kind: VERSIONAL_APPARATUS_STREAM
    reading: SHORTER_OMITS_DELIVERANCE
    reported_support:
      - siglum: vg
        label: Vulgate
        type: VERSIONAL_STREAM_NOT_SINGLE_MANUSCRIPT
      - siglum: sa
        label: Sahidic_Coptic
        type: VERSIONAL_STREAM_NOT_SINGLE_MANUSCRIPT
    evidence:
      - source: NET_Bible_Luke_11_4_textual_note
        report: "Published apparatus summary lists vg and sa with the shorter reading."
        url: "https://classic.net.bible.org/passage.php?passage=Luk+11%3A4"
      - source: NET_Bible_version_abbreviations
        report: "NET abbreviation guide distinguishes Old Latin, Vulgate, Syriac, and Sahidic as versional traditions rather than single manuscripts."
        url: "https://bible.org/list-abbreviations-net-bible-footnotes"
    guard:
      - "Vulgate and Sahidic support are versional-stream evidence, not one witness each in the physical-manuscript sense."
      - "Translation agreement does not equal independent historical attestation of Yeshua."

  - id: PAT-ORIGEN-ON-PRAYER-LUKE11
    passage: Luke_11_2_4
    kind: PATRISTIC_CITATION_AND_EXEGESIS
    author: Origen
    work: On_Prayer
    locator: "Chapter XII and following Lord's Prayer exposition"
    reading_state: SHORTER_LUKAN_FORM_CITED
    observed_features:
      - "Luke opens with simple Father rather than Matthew's Our Father in heaven."
      - "Luke lacks Matthew's will petition."
      - "Origen's quoted Lukan form ends after the testing petition rather than adding deliverance from evil."
    evidence:
      - url: "https://www.ccel.org/ccel/origen/prayer.xiii.html"
      - url: "https://www.ccel.org/ccel/origen/prayer.xvii.html"
    guard:
      - "Origen is a patristic citation/exegete, not a physical Gospel manuscript."
      - "Patristic citation can preserve textual evidence but may also paraphrase, harmonize, or reflect the author's exemplar."

  - id: VP-LUKE11-2-SPIRIT-FOR-KINGDOM
    passage: Luke_11_2
    kind: GREEK_AND_PATRISTIC_MINOR_VARIANT_REPORT
    relation: REPLACES_KINGDOM_PETITION
    reported_form_family: "May your Holy Spirit come upon us and cleanse us."
    reported_support:
      - Greek_minuscule_162
      - Greek_minuscule_700
      - Gregory_of_Nyssa
      - Maximus
    evidence:
      - source: Published_Lords_Prayer_variant_studies
        report: "Published studies describe this witness family as substituting a Holy-Spirit petition for 'your kingdom come.'"
        url: "https://www.cambridge.org/core/journals/new-testament-studies/article/abs/lords-prayer-in-matthew-and-in-john/A7F43BF0573EA3607BB0DC83A25FD7EB"
    exact_wording_state: REPORTED_VARIANT_FORM_WITH_WITNESS_LEVEL_DIFFERENCES
    guard:
      - "Witness 162 is reported with a slightly different form; do not flatten all support into one exact string."
      - "These sigla/patristic citations are not yet physically bound in Testament's witness registry."

  - id: PAT-MARCION-LUKE11-SPIRIT-PETITION
    passage: Luke_11_2
    kind: INDIRECT_TESTIMONY_TO_LOST_GOSPEL_TEXT
    lost_text: Marcion_Gospel
    relation: SPIRIT_REQUEST_IN_PLACE_OF_FIRST_PETITION_NOT_EQUATED_WITH_KINGDOM_SUBSTITUTION_FAMILY
    testimony:
      - source: Tertullian_Against_Marcion_IV_26
        state: POLEMICAL_PATRISTIC_TESTIMONY
        url: "https://www.newadvent.org/fathers/03124.htm"
      - source: Roth_2012_Lords_Prayer_in_Marcion
        state: MODERN_RECONSTRUCTION_CONTROL
        report: "Modern reassessment concludes that Marcion's text had some type of request for the Spirit in place of the first petition, while warning that reconstructing the exact wording goes beyond the evidence."
      - source: Recent_NA28_Marcion_reassessment
        state: MODERN_APPARATUS_REVIEW
        report: "Roth explicitly warns that older apparatus/reconstructions wrongly make Marcion appear to replace the kingdom petition in the same way as 700/Gregory; the evidence supports a Spirit request but not that assimilation."
        url: "https://www.cambridge.org/core/journals/new-testament-studies/article/testimony-for-marcions-gospel-in-na28-revisiting-the-apparatus-to-luke-in-the-light-of-recent-research/BA1609CD1FAEE4E429E6BDB8ED0B001B"
    exact_wording_state: NOT_RECOVERABLE_WITH_CONFIDENCE
    guard:
      - "Tertullian is indirect polemical testimony about a lost Gospel text."
      - "Do not use the 162/700/Gregory/Maximus wording to fill Marcion's lost text."
      - "Marcion's Spirit request and the kingdom-substitution witness family are related evidence problems, not one normalized variant."

invariants:
  - "VERSIONAL_STREAM != PHYSICAL_MANUSCRIPT."
  - "PATRISTIC_CITATION != GOSPEL_MANUSCRIPT."
  - "INDIRECT_LOST_TEXT_TESTIMONY != EXTANT_TEXT."
  - "Agreement across versions may reflect shared translation or harmonization history and is not counted mechanically as independent historical attestation."
