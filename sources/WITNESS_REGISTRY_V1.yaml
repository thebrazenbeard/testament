        reading_note: "Published critical commentary reports 162 replacing 'your kingdom come' with a Holy-Spirit petition. Compared with 700, 162 has the sequence 'your Spirit, the Holy' and omits the 'upon us' phrase. The exact Vatican image targets for both sides of folio 151 are now bound; the passage side and pixel-level reading remain pending."
