      - passage: Thomas_92
        reading_state: EXTANT_COPTIC_ONLY_CURRENTLY_BOUND
        reading_note: "Directly preserves a seek/find saying related to the Synoptic ask/seek/knock cluster; Testament has no surviving Greek manuscript witness for logion 92."
