        reading_state: EXTANT_COPTIC
        reading_note: "Directly preserves the mustard-seed parable in the Coptic Gospel of Thomas; no currently bound Greek Thomas fragment preserves logion 20."
      - passage: Thomas_100
        reading_state: EXTANT_COPTIC
        reading_note: "Directly preserves the Caesar/God saying with Thomas's additional final demand that what belongs to Jesus be given to him; no currently bound Greek Thomas fragment preserves logion 100."
      - passage: Thomas_107
        reading_state: EXTANT_COPTIC
        reading_note: "Directly preserves the lost-sheep parable with the distinctive largest-sheep and love-more-than-the-ninety-nine motifs; no currently bound Greek Thomas fragment preserves logion 107."
      - passage: Thomas_4
        reading_state: EXTANT_COPTIC
        reading_note: "Directly preserves Thomas 4 in Coptic; the extant Coptic form contains first-to-last wording but omits the reciprocal last-to-first phrase present in the Greek P.Oxy. 654 reconstruction."
      - passage: Thomas_55
        reading_state: EXTANT_COPTIC
        reading_note: "Directly preserves a family-renunciation saying combining hatred of parents/siblings with taking up the cross and becoming worthy; no currently bound Greek Thomas fragment preserves logion 55."
      - passage: Thomas_101
        reading_state: EXTANT_COPTIC_WITH_LACUNAE
        reading_note: "Directly preserves a related family-renunciation saying with hate/love antithesis and damaged text around the mother language; the extant witness is lacunose and no currently bound Greek Thomas fragment preserves logion 101."
      - passage: Thomas_26
        reading_state: EXTANT_COPTIC
        reading_note: "Directly preserves the complete Coptic speck/log saying corresponding to the fragmentary Greek P.Oxy. 1 witness."
      - passage: Thomas_3
        reading_state: EXTANT_COPTIC
        reading_note: "Directly preserves the complete Coptic kingdom-inside/outside saying corresponding in part to Greek P.Oxy. 654."
      - passage: Thomas_113
        reading_state: EXTANT_COPTIC_ONLY_CURRENTLY_BOUND
        reading_note: "Directly preserves the kingdom-spread-upon-the-earth saying; no currently bound Greek Thomas fragment preserves logion 113."
      - passage: Thomas_65
        reading_state: EXTANT_COPTIC
        reading_note: "Directly preserves the vineyard/tenant parable in the Coptic Gospel of Thomas; no currently bound Greek Thomas fragment preserves logion 65."
      - passage: Thomas_66
        reading_state: EXTANT_COPTIC
        reading_note: "Directly preserves the adjacent rejected-stone saying as a separate logion; no currently bound Greek Thomas fragment preserves logion 66."
    manuscript_context:
      - source: NASSCAL
        url: "https://www.nasscal.com/manuscripta-apocryphorum/cairo-coptic-museum-inv-10544-nag-hammadi-codex-ii/"
      - source: Coptic_SCRIPTORIUM
        url: "https://data.copticscriptorium.org/texts/thomasgospel/gospel-of-thomas/"
    limitations:
      - "Witness date is not the composition date of Gospel of Thomas or of any individual saying."
      - "The extant text at Thomas 54, 68 and 69 is Coptic; Testament has no surviving Greek manuscript wording for these logia."
      - "Comparison with Greek Synoptic wording must not silently back-translate the Coptic into a claimed Greek exemplar."
      - "Digital text/manuscript access is not described as autoptic physical codex examination."


