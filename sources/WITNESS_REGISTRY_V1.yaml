        reading_note: "Directly preserves the first/last reversal within Thomas 4; the published Greek reconstruction includes both first-to-last and last-to-first wording before the unity clause."
      - passage: Thomas_3
        reading_state: EXTANT_FRAGMENTARY_GREEK
        reading_note: "Directly preserves substantial portions of Thomas 3. Some lines are lacunose; Coptic wording must not be used to fill Greek gaps without labeling reconstruction."
        scholarship:
          - url: "https://www.nasscal.com/manuscripta-apocryphorum/london-british-library-pap-1531-p-oxy-iv-654/"
    manuscript_context:
