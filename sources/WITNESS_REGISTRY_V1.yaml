    limitations:
      - "The old folio-only locator has been reduced to exact 151r/151v image targets, but current evidence has not yet established which side contains Luke 11:2."
      - "Testament has not yet performed direct pixel-level image collation at the Luke 11:2 locus."
      - "This late witness proves medieval transmission of the variant, not early historical origin."

