schema_version: testament.witness_registry.v2
status: ACTIVE
upstream_model:
  repo: thebrazenbeard/on-theo
  commit: 7e354667770a6c4bed958a01c5ff843345a35b40
  files:
    - docs/V1_WITNESS_MODEL_ADDENDUM.md
    - registry/witnesses.yaml

rules:
  - "SOURCE and WITNESS are distinct."
  - "A witness ID identifies a physical/recoverable witness, not a passage or reading."
  - "One physical codex may witness multiple source works; passage readings live under locators."
  - "Witness date never becomes composition date or reading date."
  - "Witness-specific reading never becomes whole-work reading without inference."
  - "Corrector/hand state belongs to the locator, not the physical witness identity."
  - "Scholarly report is not autoptic manuscript readback."
  - "Multiple manuscripts of one work are not multiple independent historical sources."

witnesses:
  - id: WIT-D05-CODEX-BEZAE
    witness_of: [SRC-MATTHEW, SRC-MARK, SRC-LUKE-ACTS, SRC-JOHN]
    witness_kind: Greek_Latin_diglot_codex
    common_name: Codex_Bezae_Cantabrigiensis
    Gregory_Aland: D_05
    Latin_siglum: d_VL5
    shelfmark: "Cambridge University Library MS Nn.2.41"
    witness_date:
      precision: "around 400 CE / late fourth to early fifth century"
    access_mode: SCHOLARLY_WITNESS_REPORT_PLUS_INSTITUTIONAL_METADATA
    locators:
      - passage: Luke_3_22
        reading_note: "Greek text preserves a Psalm 2:7-type 'today I have begotten you' form of the baptismal voice."
        scholarship:
          - doi: "10.1163/9789004273931_010"
          - doi: "10.1163/15685365-12341684"
      - passage: Luke_22_15_20
        reading_note: "Participates in the complex shorter/longer textual tradition."
        scholarship:
          - doi: "10.1093/jts/flae045"
      - passage: Luke_23_34a
        reading_state: FIRST_HAND_ABSENT_LATER_CORRECTION_REPORTED
        reading_note: "Eubank reports the prayer absent in the first hand of Bezae; later correction history supplies a presence form."
        scholarship:
          - doi: "10.2307/25765950"
      - passage: Matthew_5_44
        reading_state: EXPANDED_LUKE_LIKE_FORM
        reading_note: "Published textual notes report Bezae among witnesses to the expanded form importing Luke 6:27-28-like clauses into Matthew 5:44."
        scholarship:
          - url: "https://www.biblegateway.com/passage/?search=Matthew+5%3A44&version=NET"
      - passage: Luke_6_5D_Sabbath_worker_addition
        reading_state: DISTINCTIVE_BEZAE_ADDITION
        manuscript_locator:
          folios: "205b/206a"
          sequence_note: "Addition follows Luke 6:4 in Bezae's sequence and is conventionally cited as Luke 6:5D / the Cambridge pericope."
        reading_note: "Codex Bezae inserts the Sabbath-worker saying immediately after Luke 6:4 in its sequence. Ernst Bammel identifies the manuscript location as fol. 205b/206a. Testament has not yet performed direct digital-image readback and does not promote the reading to original Luke or historical Yeshua speech."
        scholarship:
          - doi: "10.1017/S0028688500013655"
          - url: "https://www.cambridge.org/core/journals/new-testament-studies/article/abs/cambridge-pericope-the-addition-to-luke-64-in-codex-bezae/D3426B5A234ED8EE21B2A26E40CD8CD0"
          - url: "https://greeknewtestament.net/lk6-5"
      - passage: Luke_11_2_opening_address
        reading_state: EXPANDED_MATTHEAN_STYLE_ADDRESS
        reading_note: "Published apparatus summaries report Bezae with the expanded 'Our Father in heaven' form."
        scholarship:
          - source: "Bruce_Terry_Student_Guide_Luke_11_2"
      - passage: Luke_11_4_deliverance_petition
        reading_state: EXPANDED_DELIVERANCE_FORM
        reading_note: "Published textual summaries report Bezae among witnesses including the Matthean-style deliverance-from-evil petition."
        scholarship:
          - source: "Bruce_Terry_Student_Guide_Luke_11_4"
    limitations:
      - "Testament has not performed autoptic manuscript collation."
      - "D05's age does not establish that every distinctive reading is earlier than rival readings."
      - "Hand/corrector detail remains dependent on published apparatus/scholarship until image-level readback."

