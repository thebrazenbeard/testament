schema_version: testament.witness_registry.v1
status: ACTIVE_SEED
upstream_model:
  repo: thebrazenbeard/on-theo
  commit: 7e354667770a6c4bed958a01c5ff843345a35b40
  files:
    - docs/V1_WITNESS_MODEL_ADDENDUM.md
    - registry/witnesses.yaml

rules:
  - "SOURCE and WITNESS are distinct."
  - "Witness date never becomes composition date."
  - "Witness-specific reading never becomes whole-work reading without inference."
  - "Scholarly report is not autoptic manuscript readback."
  - "Multiple manuscripts of one work are not multiple independent historical sources."

witnesses:
  - id: WIT-D05-CODEX-BEZAE
    witness_of: SRC-LUKE-ACTS
    witness_kind: Greek_Latin_diglot_codex
    common_name: Codex Bezae Cantabrigiensis
    Gregory_Aland: D_05
    witness_date:
      precision: commonly_fifth_century
    access_mode: SCHOLARLY_WITNESS_REPORT
    locators:
      - passage: Luke_3_22
        reading_note: "Preserves a Psalm 2:7-type 'today I have begotten you' form of the baptismal voice."
        scholarship:
          - doi: "10.1163/9789004273931_010"
          - doi: "10.1163/15685365-12341684"
      - passage: Luke_22_15_20
        reading_note: "Participates in the complex shorter/longer textual tradition."
        scholarship:
          - doi: "10.1093/jts/flae045"
    limitations:
      - "Testament has not performed autoptic manuscript collation."
      - "D05's age does not establish that every distinctive reading is earlier than rival readings."

  - id: WIT-MARK-SINAITICUS-ENDING
    witness_of: SRC-MARK
    witness_kind: Greek_codex
    common_name: Codex Sinaiticus
    Gregory_Aland: "01"
    witness_date:
      precision: fourth_century
    access_mode: SCHOLARLY_WITNESS_REPORT
    locators:
      - passage: Mark_16_8
        reading_note: "Witnesses Mark ending at 16:8 rather than continuing with 16:9-20."
        scholarship:
          - title: "Unfinished Business: The Ending of Mark in Two Catena Manuscripts"
            venue: New Testament Studies
            year: 2023
    limitations:
      - "One manuscript does not define the earliest attainable text by itself."

  - id: WIT-MARK-VATICANUS-ENDING
    witness_of: SRC-MARK
    witness_kind: Greek_codex
    common_name: Codex Vaticanus
    Gregory_Aland: "03"
    witness_date:
      precision: fourth_century
    access_mode: SCHOLARLY_WITNESS_REPORT
    locators:
      - passage: Mark_16_8
        reading_note: "Witnesses Mark ending at 16:8."
    limitations:
      - "Must be evaluated with versions, patristic evidence, other manuscripts, and ECM analysis."

edition_nodes:
  - id: ED-SBLGNT
    kind: CRITICAL_EDITION
    title: SBL Greek New Testament
    editor: Michael_W_Holmes
    license: CC_BY_4_0
    role: DEFAULT_REPRODUCIBLE_WORKING_GREEK_TEXT
    guard: "Not treated as the original text or final authority."
