schema_version: testament.witness_registry.v2
status: ACTIVE
upstream_model:
  repo: thebrazenbeard/on-theo
  commit: 7e354667770a6c4bed958a01c5ff843345a35b40
  files:
    - docs/V1_WITNESS_MODEL_ADDENDUM.md
    - registry/witnesses.yaml

rules:
  - "SOURCE and WITNESS are distinct."
  - "A witness ID identifies a physical/recoverable witness, not a passage or reading."
  - "One physical codex may witness multiple source works; passage readings live under locators."
  - "Witness date never becomes composition date or reading date."
  - "Witness-specific reading never becomes whole-work reading without inference."
  - "Corrector/hand state belongs to the locator, not the physical witness identity."
  - "Scholarly report is not autoptic manuscript readback."
  - "Multiple manuscripts of one work are not multiple independent historical sources."

witnesses:
  - id: WIT-D05-CODEX-BEZAE
    witness_of: [SRC-MATTHEW, SRC-MARK, SRC-LUKE-ACTS, SRC-JOHN]
    witness_kind: Greek_Latin_diglot_codex
    common_name: Codex_Bezae_Cantabrigiensis
    Gregory_Aland: D_05
    Latin_siglum: d_VL5
    shelfmark: "Cambridge University Library MS Nn.2.41"
    witness_date:
      precision: "around 400 CE / late fourth to early fifth century"
    access_mode: SCHOLARLY_WITNESS_REPORT_PLUS_INSTITUTIONAL_METADATA_PLUS_LOCAL_DIRECT_DIGITAL_IMAGE_READBACK
    locators:
      - passage: Luke_3_22
        reading_note: "Greek text preserves a Psalm 2:7-type 'today I have begotten you' form of the baptismal voice."
        scholarship:
          - doi: "10.1163/9789004273931_010"
          - doi: "10.1163/15685365-12341684"
      - passage: Luke_22_15_20
        reading_note: "Participates in the complex shorter/longer textual tradition."
        scholarship:
          - doi: "10.1093/jts/flae045"
      - passage: Luke_23_34a
        reading_state: FIRST_HAND_ABSENT_LATER_CORRECTION_REPORTED
        reading_note: "Eubank reports the prayer absent in the first hand of Bezae; later correction history supplies a presence form."
        scholarship:
          - doi: "10.2307/25765950"
      - passage: Matthew_5_44
        reading_state: EXPANDED_LUKE_LIKE_FORM
        reading_note: "Published textual notes report Bezae among witnesses to the expanded form importing Luke 6:27-28-like clauses into Matthew 5:44."
        scholarship:
          - url: "https://www.biblegateway.com/passage/?search=Matthew+5%3A44&version=NET"
      - passage: Luke_6_5D_Sabbath_worker_addition
        reading_state: DISTINCTIVE_BEZAE_ADDITION_DIRECT_DIGITAL_IMAGE_READBACK
        manuscript_locator:
          folios_legacy: "205b/206a"
          folios_current: "205v/206r"
          cudl_canvases:
            Greek_205v: 391
            Latin_206r: 392
          iiif_image_service_greek: "https://images.lib.cam.ac.uk/iiif/MS-NN-00002-00041-002-00064.jp2"
          iiif_image_service_latin: "https://images.lib.cam.ac.uk/iiif/MS-NN-00002-00041-002-00065.jp2"
          sequence_note: "Addition follows Luke 6:4 in Bezae's sequence and is conventionally cited as Luke 6:5D / the Cambridge pericope."
        image_readback:
          state: DIRECT_DIGITAL_IMAGE_VISUALLY_INSPECTED
          checked: "2026-09-19"
          observation: "A direct digital reproduction of folios 205v-206r was visually inspected. The Greek page visibly contains the distinctive Sabbath-worker paragraph in the manuscript text block; the facing Latin page preserves the corresponding passage."
          exact_text_boundary: "Exact normalized Greek wording remains tied to the published Cambridge/IGNTP transcription and scholarship; the image inspection confirms physical presence/location and substantial legibility, not a fresh independent diplomatic transcription of every character."
        reading_note: "Codex Bezae directly preserves the Sabbath-worker saying on the digitized 205v/206r spread immediately after Luke 6:4. Direct digital-image evidence now closes the prior image-readback debt, without promoting the reading to original Luke or historical Yeshua speech."
        institutional_evidence:
          - source: CUDL_IIIF_manifest
            url: "https://cudl.lib.cam.ac.uk/iiif/MS-NN-00002-00041"
            report: "Canvas 391 is labeled 205v and maps to the Greek image service; canvas 392 is labeled 206r and maps to the facing Latin image service."
          - source: Biblissima_CUDL_manifest_index
            url: "https://iiif.biblissima.fr/collections/manifest/c1bed556153d5e320842b2933d4d6b630d9d15b6"
            report: "Metadata identifies the unique Sabbath-worker story after Luke 6:4 on folios 205v and 206."
        scholarship:
          - doi: "10.1017/S0028688500013655"
          - url: "https://www.cambridge.org/core/journals/new-testament-studies/article/abs/cambridge-pericope-the-addition-to-luke-64-in-codex-bezae/D3426B5A234ED8EE21B2A26E40CD8CD0"
          - url: "https://itseeweb.cal.bham.ac.uk/igntp/bezae.html"
          - url: "https://greeknewtestament.net/lk6-5"
      - passage: Luke_17_21
        reading_state: DIRECT_IGNTP_LATIN_TRANSCRIPTION_BOUND
        column: Latin
        manuscript_locator:
          folio_current: "256r"
          folio_ink_page: "236"
          cudl_canvas: 492
          tei_verse_id: B03K17V21
          line_range: "P256rC1L3-05 through P256rC1L6-05"
        direct_transcription:
          source: IGNTP_Bezae_Latin_XML_v1
          url: "https://epapers.bham.ac.uk/id/eprint/1664/1/Bezae-Latin.xml"
          target_clause: "ecce enim regnum dei intra uos est"
          exact_tei_target_tokens: [ecce, enim, regnum, dei, intra, uos, est]
          wider_verse_note: "The TEI transcription also has neque dicent ecce hic aut cce illi / nolite credere before the target clause; this wider Bezae Latin form is preserved as witness-specific transcription rather than normalized to the Vulgate."
          checked: "2026-09-19"
        evidence_class: DIRECT_INSTITUTIONAL_ELECTRONIC_TRANSCRIPTION_NOT_IMAGE_AUTOPSY_AT_THIS_LOCUS
        reading_note: "The official IGNTP/Cambridge transcription directly binds the Bezae Latin column at Luke 17:21 to intra uos. This replaces secondary-only reporting for the Bezae witness while leaving the collective Vetus Latina tradition separate."
        institutional_evidence:
          - source: Birmingham_ePapers_Bezae_Latin
            url: "https://epapers.bham.ac.uk/id/eprint/1664/"
            report: "Repository record identifies Bezae-Latin.xml as the IGNTP electronic transcription commissioned for Cambridge University Library's digital manuscript."
          - source: IGNTP_Bezae_transcription_project
            url: "https://itseeweb.cal.bham.ac.uk/igntp/bezae.html"
            report: "IGNTP states that the Latin XML transcription is archived in the Birmingham repository and displayed alongside Cambridge images."
        guard: "Direct XML transcription is stronger than a secondary report but is not direct visual autopsy of folio 256r in this pass; one Bezae Latin witness does not equal the whole Vetus Latina tradition."
      - passage: Luke_11_2_opening_address
        reading_state: EXPANDED_MATTHEAN_STYLE_ADDRESS
        reading_note: "Published apparatus summaries report Bezae with the expanded 'Our Father in heaven' form."
        scholarship:
          - source: "Bruce_Terry_Student_Guide_Luke_11_2"
      - passage: Luke_11_4_deliverance_petition
        reading_state: EXPANDED_DELIVERANCE_FORM
        reading_note: "Published textual summaries report Bezae among witnesses including the Matthean-style deliverance-from-evil petition."
        scholarship:
          - source: "Bruce_Terry_Student_Guide_Luke_11_4"
    limitations:
      - "Testament has not performed complete-codex autoptic manuscript collation; the Luke 6:4/5D 205v-206r spread has direct digital-image readback only."
      - "D05's age does not establish that every distinctive reading is earlier than rival readings."
      - "Hand/corrector detail remains dependent on published apparatus/scholarship until image-level readback."

