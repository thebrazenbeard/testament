schema_version: testament.p0_source_ledger.v2
status: CORE_WITNESSES_REGISTERED_RESEARCH_ACTIVE
scope: "Priority sources and material anchors for Books I-IV; not a complete bibliography."

records:
  - id: SRC-PAUL-GALATIANS
    kind: PRIMARY_TEXT
    work: Galatians
    author: Paul
    horizon: "mid-first century CE"
    locators: ["1:18-24", "2:1-14"]
    use: "Paul's self-reported contacts with Cephas/James, movement conflict, and chronology."
    limits: "Does not narrate Yeshua's ministry; manuscript witness history still requires critical-edition binding."

  - id: SRC-PAUL-1CORINTHIANS
    kind: PRIMARY_TEXT
    work: First Corinthians
    author: Paul
    horizon: "mid-first century CE"
    locators: ["7", "9:5", "11:23-26", "15:3-8"]
    use: "Early Lord-saying reception, last-meal tradition, death/burial/raising/appearance tradition."
    limits: "No detailed Gospel-style Passion or empty-tomb narrative."

  - id: SRC-MARK
    kind: PRIMARY_TEXT
    work: Gospel according to Mark
    horizon: "commonly c. 65-75 CE"
    use: "Earliest extant narrative Gospel under common dating."
    limits: "Literary/theological narrative; Matthew/Luke repetition is not independent by default; exact critical edition/witness must be declared where wording matters."

  - id: SRC-MATTHEW
    kind: PRIMARY_TEXT
    work: Gospel according to Matthew
    horizon: "commonly c. 80-95 CE"
    use: "Distinct infancy, sayings, community, Passion, and resurrection forms."
    limits: "Substantial Markan dependence probable; double-tradition independence disputed."

  - id: SRC-LUKE-ACTS
    kind: PRIMARY_TEXT_TWO_VOLUME_WORK
    work: Luke-Acts
    horizon: "commonly c. 80-95 CE; dating debated"
    use: "Distinct infancy and resurrection forms; later narrative witness to earliest movement and Paul."
    limits: "Acts must be checked against Paul's own letters for Pauline chronology/conflict; idealized Jerusalem summaries are not historical floor by default."

  - id: SRC-JOHN
    kind: PRIMARY_TEXT
    work: Gospel according to John
    horizon: "late first/early second century final-form range often proposed; strata debated"
    use: "Distinctive ministry geography, Jerusalem material, Passion chronology, and resurrection traditions."
    limits: "Long discourses are not exact transcripts by default; relation to Synoptics is unit-specific and disputed."

  - id: SRC-DIDACHE
    kind: PRIMARY_TEXT_EARLY_CHRISTIAN_COMPOSITE
    work: Didache
    horizon: "composite early Christian work; compositional stages and dating remain disputed"
    use: "Early reception/transmission witness for sayings, ethics, Two Ways material, liturgy, and community practice."
    limits: "Does not become an independent historical-Jesus witness merely by paralleling Synoptic sayings; exact dependence must be argued per unit. Physical witness date is not composition date."

  - id: SRC-JOSEPHUS-ANTIQUITIES-18-JOHN
    kind: PRIMARY_TEXT
    work: Jewish Antiquities
    author: Flavius Josephus
    locator: "18.116-119"
    access: "https://www.perseus.tufts.edu/hopper/text?doc=Perseus%3Atext%3A1999.01.0146%3Abook%3D18%3Asection%3D116"
    use: "External literary witness to John the Baptist and Herod Antipas."
    limits: "Later than John's death; does not establish Jesus-John relationship."

  - id: SRC-JOSEPHUS-ANTIQUITIES-20-JAMES
    kind: PRIMARY_TEXT
    work: Jewish Antiquities
    author: Flavius Josephus
    locator: "20.200"
    use: "Potential external witness to James identified in relation to Jesus called Christ."
    limits: "Authenticity and exact textual history must remain explicit; not evidence for detailed Gospel biography."

  - id: SRC-PHILO-LEGATIO-PILATE
    kind: PRIMARY_TEXT
    work: Legatio ad Gaium
    author: Philo of Alexandria
    locator: "299-305"
    use: "Near-contemporary literary context for Pilate's administration and Jerusalem shield incident."
    limits: "Rhetorical/theological aims affect characterization; no direct Yeshua biography."

  - id: SRC-TACITUS-ANNALS-15_44
    kind: PRIMARY_TEXT_EXTERNAL_ROMAN
    work: Annals
    author: Tacitus
    locator: "15.44"
    horizon: "early second century CE"
    use: "Later Roman witness that Christus was executed under Pontius Pilate during Tiberius's reign and that Christians were known at Rome under Nero."
    limits: "Source of Tacitus's information is not explicit; does not verify Gospel trial details."

  - id: MAT-PILATE-INSCRIPTION
    kind: MATERIAL_EVIDENCE
    artifact: Caesarea inscription naming Pontius Pilatus as praefectus Iudaeae
    discovery_year: 1961
    use: "Pilate identity/title and Roman provincial context."
    limits: "Says nothing about Yeshua."

  - id: MAT-YEHOHANAN-CRUCIFIXION
    kind: MATERIAL_EVIDENCE
    artifact: "Calcaneus pierced by iron nail from first-century Jerusalem burial"
    use: "Direct evidence of at least one crucifixion technique in Judaea."
    limits: "Does not determine Yeshua's exact crucifixion mechanics."

